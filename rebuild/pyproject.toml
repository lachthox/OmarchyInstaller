[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-installer-rebuild"
version = "0.1.0.dev0"
description = "Coordination scaffold for the OmarchyInstaller Python rebuild"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2.0",
  "textual>=0.61,<1.0",
  "rich>=13.7,<14.0",
  "pydantic>=2.7,<3.0",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
  "pytest>=8.0,<9.0",
  "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["installer*"]
