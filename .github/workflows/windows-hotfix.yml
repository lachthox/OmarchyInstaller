name: Windows Hotfix EXE

on:
  workflow_dispatch:
    inputs:
      product_version:
        description: Windows EXE semantic version (X.Y.Z)
        required: true
        type: string
      publish_tag:
        description: New prerelease tag for this Windows-only build
        required: true
        type: string
      runtime_release_tag:
        description: Existing full release supplying ISO and manifests
        required: true
        default: v0.1.6
        type: string

permissions:
  contents: write

jobs:
  build-test-publish-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - name: Install Windows build dependencies
        run: python -m pip install -r rebuild/requirements.txt -r rebuild/requirements-dev.txt pyinstaller
      - name: Run Windows installer regression suite
        run: >-
          python -m pytest
          rebuild/tests/test_release_provisioning.py
          rebuild/tests/test_disk_inventory.py
          rebuild/tests/test_windows_backup.py
          rebuild/tests/test_windows_checks.py
          rebuild/tests/test_windows_launcher.py
          rebuild/tests/test_windows_tui_pilot.py
          rebuild/tests/test_windows_flow.py
          rebuild/tests/test_windows_disk_safety.py
          rebuild/tests/test_windows_handoff.py
          -q
      - name: Run focused static checks
        run: |
          python -m ruff check rebuild
          python -m mypy rebuild/installer/platforms/windows rebuild/tools/windows/omarchy_installer_launcher.py rebuild/tools/build_windows_exe.py
      - name: Confirm runtime release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.runtime_release_tag }}" --repo "${{ github.repository }}"
      - name: Build elevated real-apply EXE
        run: >-
          python rebuild/tools/build_windows_exe.py
          --workspace "$env:GITHUB_WORKSPACE"
          --output-dir rebuild/dist/windows-hotfix
          --work-dir rebuild/dist/windows-hotfix-work
          --release-version "${{ inputs.product_version }}"
          --release-tag "${{ inputs.runtime_release_tag }}"
      - name: Verify embedded Administrator manifest
        run: >-
          python -c "from pathlib import Path;
          data=Path('rebuild/dist/windows-hotfix/OmarchyInstaller.exe').read_bytes();
          assert b'requireAdministrator' in data"
      - name: Publish Windows-only bug-test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.publish_tag }}"
          rebuild/dist/windows-hotfix/OmarchyInstaller.exe
          rebuild/dist/windows-hotfix/OmarchyInstaller.exe.sha256
          rebuild/dist/windows-hotfix/windows-exe-build-manifest.json
          --repo "${{ github.repository }}"
          --target "$env:GITHUB_SHA"
          --prerelease
          --title "Windows hotfix ${{ inputs.publish_tag }}"
          --notes "Rapid Windows-only bug-test build from $env:GITHUB_SHA. The EXE reuses the already validated ISO and manifests from ${{ inputs.runtime_release_tag }}. Unsigned build: verify OmarchyInstaller.exe.sha256 before running."
