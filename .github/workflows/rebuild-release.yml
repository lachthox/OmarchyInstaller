name: Rebuild Release Pipeline

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version (X.Y.Z)"
        required: true
        type: string
      tag:
        description: "New immutable release tag"
        required: true
        type: string
      publish:
        description: "Upload assets to GitHub Release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUTPUT_DIR: ${{ github.workspace }}/rebuild/dist/release-iso
      WORK_DIR: ${{ github.workspace }}/rebuild/dist/release-iso-work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ISO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            squashfs-tools \
            erofs-utils \
            rsync \
            curl

      - name: Build ISO artifact
        shell: bash
        run: |
          python rebuild/tools/build_iso_pipeline.py \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$OUTPUT_DIR" \
            --work-dir "$WORK_DIR" \
            --release-version "${{ inputs.release_version }}" \
            --release-tag "${{ inputs.tag }}"

      - name: Upload ISO outputs
        uses: actions/upload-artifact@v7
        with:
          name: release-iso-output
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error

  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: ${{ github.workspace }}\rebuild\dist\release-windows-exe
      WORK_DIR: ${{ github.workspace }}\rebuild\dist\release-windows-exe-work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install EXE dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rebuild/requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows EXE artifact
        shell: pwsh
        run: |
          python rebuild/tools/build_windows_exe.py `
            --workspace "$env:GITHUB_WORKSPACE" `
            --output-dir "$env:OUTPUT_DIR" `
            --work-dir "$env:WORK_DIR" `
            --release-version "${{ inputs.release_version }}" `
            --release-tag "${{ inputs.tag }}"

      - name: Upload Windows EXE outputs
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-exe-output
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-iso
      - build-windows-exe
    timeout-minutes: 30
    env:
      INPUT_DIR: ${{ github.workspace }}/rebuild/dist/release-inputs
      OUTPUT_DIR: ${{ github.workspace }}/rebuild/dist/release-output
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download ISO artifact bundle
        uses: actions/download-artifact@v8
        with:
          name: release-iso-output
          path: ${{ env.INPUT_DIR }}/iso

      - name: Download Windows EXE artifact bundle
        uses: actions/download-artifact@v8
        with:
          name: release-windows-exe-output
          path: ${{ env.INPUT_DIR }}/windows

      - name: Build release metadata and optionally publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXTRA_ARGS=()
          EXTRA_ARGS+=(--tag "${{ inputs.tag }}")
          python -m rebuild.tools.publish_release \
            --workspace "$GITHUB_WORKSPACE" \
            --artifact-dir "$INPUT_DIR" \
            --output-dir "$OUTPUT_DIR" \
            "${EXTRA_ARGS[@]}"

      - name: Attest ISO and Windows executable provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ env.INPUT_DIR }}/iso/*-omarchy-auto.iso
            ${{ env.INPUT_DIR }}/windows/OmarchyInstaller.exe

      - name: Attest release metadata provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ env.OUTPUT_DIR }}/release_manifest.json
            ${{ env.OUTPUT_DIR }}/compatibility_manifest.json
            ${{ env.OUTPUT_DIR }}/sha256sums.txt

      - name: Publish immutable release after attestations
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python -m rebuild.tools.publish_release \
            --workspace "$GITHUB_WORKSPACE" \
            --artifact-dir "$INPUT_DIR" \
            --output-dir "$OUTPUT_DIR" \
            --tag "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --publish --publish-only

      - name: Upload release metadata bundle
        uses: actions/upload-artifact@v7
        with:
          name: rebuild-release-output
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
