name: Rebuild Windows EXE Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run metadata generation only (skip PyInstaller executable build)"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - Python-Rebuild
      - main
    paths:
      - "windows-prep.ps1"
      - "rebuild/installer/shared/**"
      - "rebuild/tools/build_windows_exe.py"
      - "rebuild/tools/windows/omarchy_installer_launcher.py"
      - ".github/workflows/rebuild-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: ${{ github.workspace }}\rebuild\dist\rebuild-windows-exe
      WORK_DIR: ${{ github.workspace }}\rebuild\dist\rebuild-windows-exe-work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r rebuild/requirements.txt
          python -m pip install pyinstaller

      - name: Build OmarchyInstaller.exe
        shell: pwsh
        run: |
          $extraArgs = @()
          if ("${{ github.event.inputs.dry_run || 'false' }}" -eq "true") {
            $extraArgs += "--dry-run"
          }

          python rebuild/tools/build_windows_exe.py `
            --workspace "$env:GITHUB_WORKSPACE" `
            --output-dir "$env:OUTPUT_DIR" `
            --work-dir "$env:WORK_DIR" `
            @extraArgs

      - name: Upload Windows EXE outputs
        uses: actions/upload-artifact@v7
        with:
          name: rebuild-windows-exe-output
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
