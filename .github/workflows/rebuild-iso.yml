name: Rebuild Arch ISO Pipeline

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Semantic version (X.Y.Z)"
        type: string
        required: true
      release_tag:
        description: "Immutable release tag"
        type: string
        required: true
      dry_run:
        description: "Run payload + manifest generation only (no full ISO build)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-rebuild-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUTPUT_DIR: ${{ github.workspace }}/rebuild/dist/rebuild-iso
      WORK_DIR: ${{ github.workspace }}/rebuild/dist/rebuild-iso-work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            squashfs-tools \
            erofs-utils \
            rsync \
            curl

      - name: Build rebuild ISO artifact
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [[ "${{ github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            EXTRA_ARGS+=(--dry-run)
          fi

          python rebuild/tools/build_iso_pipeline.py \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir "$OUTPUT_DIR" \
            --work-dir "$WORK_DIR" \
            --release-version "${{ inputs.release_version }}" \
            --release-tag "${{ inputs.release_tag }}" \
            "${EXTRA_ARGS[@]}"

      - name: Upload rebuild ISO outputs
        uses: actions/upload-artifact@v7
        with:
          name: rebuild-iso-output
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
